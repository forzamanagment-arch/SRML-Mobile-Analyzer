[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "srml-mobile-analyzer"
version = "0.1.0"
description = "Conservative Unity IL2CPP metadata and ELF structural inspector"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
srml-analyzer = "srml_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["srml_analyzer*"]
