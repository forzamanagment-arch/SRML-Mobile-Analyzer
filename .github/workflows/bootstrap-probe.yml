name: Build FusionCore Bootstrap Probe

on:
  workflow_dispatch:
  push:
    paths:
      - "runtime/BootstrapProbe/**"
      - ".github/workflows/bootstrap-probe.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SRML Mobile
        uses: actions/checkout@v4

      - name: Checkout exact FusionCore runtime source
        uses: actions/checkout@v4
        with:
          repository: All-Of-Us-Mods/FusionCore
          ref: "0.045"
          path: deps/FusionCore

      - name: Extract embedded BepInEx Fusion runtime
        run: |
          mkdir -p deps/FusionCoreRuntime
          unzip -q deps/FusionCore/fusionApp/src/main/assets/BepInEx-arm64.zip -d deps/FusionCoreRuntime
          for file in \
            BepInEx.Core.dll \
            BepInEx.Unity.Common.dll \
            BepInEx.Unity.IL2CPP.dll \
            Il2CppInterop.Common.dll \
            Il2CppInterop.Runtime.dll \
            MonoMod.RuntimeDetour.dll; do
            test -f "deps/FusionCoreRuntime/core/$file"
          done

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build probe against FusionCore's exact runtime assemblies
        run: dotnet build runtime/BootstrapProbe/BootstrapProbe.csproj --configuration Release --output artifacts/BootstrapProbe

      - name: Package probe plugin
        run: |
          mkdir -p artifacts/package/BepInEx/plugins
          cp artifacts/BootstrapProbe/BootstrapProbe.dll artifacts/package/BepInEx/plugins/
          cd artifacts/package
          zip -r ../../SRMLMobile-BootstrapProbe-FusionCore.zip BepInEx

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRMLMobile-BootstrapProbe-FusionCore
          path: SRMLMobile-BootstrapProbe-FusionCore.zip
          if-no-files-found: error
