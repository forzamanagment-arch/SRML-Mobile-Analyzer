name: Inspect FusionCore upstream APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-fusioncore-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install APK inspection tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "build-tools;36.0.0"

      - name: Download and inspect official release APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspection
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"

          download_and_inspect() {
            local tag="$1"
            local expected_sha="$2"
            local apk="inspection/fusioncore-$tag.apk"
            local url="https://github.com/All-Of-Us-Mods/FusionCore/releases/download/$tag/fusionApp-release.apk"

            echo "=== Download $tag ==="
            curl --fail --location --retry 3 --retry-all-errors "$url" --output "$apk"
            echo "$expected_sha  $apk" | sha256sum --check -

            echo "=== APK badging: $tag ==="
            "$AAPT" dump badging "$apk" | tee "inspection/$tag-badging.txt"
            grep -F "name='dev.allofus.fusioncore'" "inspection/$tag-badging.txt" >/dev/null

            echo "=== APK permissions: $tag ==="
            "$AAPT" dump permissions "$apk" | tee "inspection/$tag-permissions.txt"

            echo "=== APK signature: $tag ==="
            "$APKSIGNER" verify --verbose --print-certs "$apk" | tee "inspection/$tag-signature.txt"

            echo "=== Native libraries: $tag ==="
            unzip -Z1 "$apk" | grep '^lib/arm64-v8a/.*\.so$' | sort | tee "inspection/$tag-native-libs.txt"

            echo "=== Bundled runtime assets: $tag ==="
            unzip -Z1 "$apk" | grep -E '^assets/.*(BepInEx|dotnet|il2cpp2mono).*\.zip$' | sort | tee "inspection/$tag-runtime-assets.txt" || true
          }

          download_and_inspect "0.0.4" "90bcbf4e8ca0bba1ceefc6c08a072e12525d76dd696040b61db531018290e3a3"
          download_and_inspect "0.045" "661ad5ebaef78c9ea395d7751f9c4f758b263008a4e012d1167cc6ae3aec3602"

          cert_old="$(grep -m1 'certificate SHA-256 digest:' inspection/0.0.4-signature.txt | sed 's/.*digest: //' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          cert_new="$(grep -m1 'certificate SHA-256 digest:' inspection/0.045-signature.txt | sed 's/.*digest: //' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"

          {
            echo "FusionCore upstream APK inspection"
            echo "Older release: 0.0.4"
            echo "Latest inspected release: 0.045"
            echo "0.0.4 signing certificate SHA-256: $cert_old"
            echo "0.045 signing certificate SHA-256: $cert_new"
            if [[ -n "$cert_old" && "$cert_old" == "$cert_new" ]]; then
              echo "Certificate continuity: MATCH"
            else
              echo "Certificate continuity: DIFFERENT OR UNREADABLE"
              exit 1
            fi
            echo
            echo "Package metadata and permissions are in the adjacent inspection text files."
          } | tee inspection/summary.txt

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: fusioncore-upstream-apk-inspection
          path: inspection/
          if-no-files-found: error
