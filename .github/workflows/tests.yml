name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI
        run: python -m srml_analyzer --help
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check offline browser analyzer
        run: node --test web/*.test.mjs
