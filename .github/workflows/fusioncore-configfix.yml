name: Build FusionCore config-forwarding test APK

on:
  push:
    branches: [ "fusioncore-config-forwarding" ]
    paths:
      - ".github/workflows/fusioncore-configfix.yml"
      - "patches/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4

      - name: Download pinned FusionCore 0.045 source
        run: |
          curl --fail --location --retry 3 \
            https://github.com/All-Of-Us-Mods/FusionCore/archive/bf4c69d9d4724e4eff058664a5be0a1d9cfd4e61.tar.gz \
            --output fusioncore.tar.gz
          mkdir fusioncore-src
          tar -xzf fusioncore.tar.gz --strip-components=1 -C fusioncore-src

      - name: Apply narrow config-forwarding patch
        run: |
          cp patches/apply_fusioncore_configfix.py fusioncore-src/
          cd fusioncore-src
          python3 apply_fusioncore_configfix.py
          git diff --check || true
          grep -n "Forwarded FusionCore config" fusionApp/src/main/java/dev/allofus/fusioncore/hooks/GameRuntime.java
          grep -n 'applicationIdSuffix = ".configfix"' fusionApp/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build patched debug APK
        working-directory: fusioncore-src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :fusionApp:assembleDebug

      - name: Verify APK package and signature
        working-directory: fusioncore-src
        run: |
          APK="$(find fusionApp/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | grep "package: name='dev.allofus.fusioncore.configfix'"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$APK"

      - name: Upload patched test APK
        uses: actions/upload-artifact@v4
        with:
          name: FusionCore-0.045-configfix-debug
          path: fusioncore-src/fusionApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
